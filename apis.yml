name: Inloop Robotics
description: >-
  Inloop Robotics (InLoop) is a Y Combinator (Spring 2026) startup in San Francisco
  offering robotics-as-a-service for warehouses, fulfillment centers, and light
  manufacturing. Its bimanual "Loop V1" robot performs box assembly, kitting,
  visual inspection, content preparation, unpackaging, and order pick-and-pack.
  The system runs a hybrid-autonomy, human-in-the-loop model: onboard AI handles
  routine work while remote teleoperators take over on edge cases, and production
  failures feed continuous learning. InLoop sells this as a flat monthly subscription
  that bundles the hardware, ongoing AI updates, and 24/7 teleassistance fallback,
  rather than selling robots outright. As of this profile the company publishes a
  marketing site only, with no public developer portal, API, SDK, or documentation
  surface; this record tracks it as an API Evangelist network lead pending any future
  developer/API program.
